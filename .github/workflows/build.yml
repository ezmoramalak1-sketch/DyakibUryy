
name: Build Ryuma DYLIB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build arm64 iOS DYLIB
        shell: bash
        run: |
          set -euo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build

          xcrun --sdk iphoneos clang \
            -x objective-c \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -dynamiclib \
            -framework Foundation \
            -framework UIKit \
            -Wl,-install_name,@rpath/Ryuma.dylib \
            Ryuma.xm \
            -o build/Ryuma.dylib

          file build/Ryuma.dylib
          xcrun --sdk iphoneos lipo -info build/Ryuma.dylib

      - name: Upload DYLIB
        uses: actions/upload-artifact@v4
        with:
          name: Ryuma-dylib
          path: build/Ryuma.dylib
          if-no-files-found: error
