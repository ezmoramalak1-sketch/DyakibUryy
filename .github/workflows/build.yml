```yaml
name: Build Ryuma DYLIB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source file
        run: |
          if [ ! -f Ryuma.xm ]; then
            echo "ERROR: Ryuma.xm not found"
            exit 1
          fi

      - name: Build Ryuma DYLIB
        shell: bash
        run: |
          set -euo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build

          xcrun --sdk iphoneos clang \
            -x objective-c \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -dynamiclib \
            -framework Foundation \
            -framework UIKit \
            Ryuma.xm \
            -o build/Ryuma.dylib

          file build/Ryuma.dylib
          xcrun --sdk iphoneos lipo -info build/Ryuma.dylib

      - name: Upload DYLIB
        uses: actions/upload-artifact@v4
        with:
          name: Ryuma-DYLIB
          path: build/Ryuma.dylib
          if-no-files-found: error
```
